.wrap{max-width:1100px;margin:0 auto;padding:20px 16px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px}

h1{font-size:20px;margin:0 0 4px;color:var(--gold);letter-spacing:.04em}p.s{color:var(--mut);margin:0 0 14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}

button.g{background:#1a2437;color:var(--txt);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:wait}

.side{position:sticky;top:12px;align-self:start}#st{font-size:13px;color:var(--mut);margin-top:8px;text-align:center;min-height:18px}
details{margin-top:10px}summary{cursor:pointer;color:var(--mut)}

<div class="panel" style="margin-top:14px"><label style="margin-top:0">Paste Telegram post (auto-fills the fields)</label>

<div class="panel" style="margin-top:14px" id="form"></div>
</div>
<div class="side"><canvas id="cv" width="540" height="960"></canvas>

const SR=48000;
async function makeAudio(){ // returns AudioBuffer (stereo, DUR s) or null
 const mode=document.getElementById("amode").value;if(mode==="none")return null;
 const oc=new OfflineAudioContext(2,SR*DUR,SR),out=oc.createGain();

 if(mode==="file"&&f){const ab=await new AudioContext().decodeAudioData(await f.arrayBuffer());const src=oc.createBufferSource();src.buffer=ab;src.loop=true;const g=oc.createGain();g.gain.value=.8;src.connect(g).connect(out);src.start();return await oc.startRendering()}
 // generated bed: dark pad + low pulse
 const lp=oc.createBiquadFilter();lp.type="lowpass";lp.frequency.value=900;const pg=oc.createGain();pg.gain.value=.16;lp.connect(pg).connect(out);
 for(const fr of [55,82.41,110,130.81,164.81]){const o=oc.createOscillator();o.type="triangle";o.frequency.value=fr;o.detune.value=(Math.random()-.5)*8;o.connect(lp);o.start()}
 for(let t=0;t<DUR;t+=.5){const o=oc.createOscillator(),g=oc.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g).connect(out);o.start(t);o.stop(t+.32)}
 for(let t=.25;t<DUR;t+=.5){const b=oc.createBuffer(1,SR*.05,SR),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=oc.createBufferSource(),hp=oc.createBiquadFilter(),g=oc.createGain();hp.type="highpass";hp.frequency.value=6000;g.gain.value=.05;s.buffer=b;s.connect(hp).connect(g).connect(out);s.start(t)}
 return await oc.startRendering()}
async function encodeAudio(buf){

 await enc.flush();return desc?{chunks,desc,sr:SR,ch:2}:null}
